name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: sh -n install.sh uninstall.sh doctor.sh scripts/serve-rapid-mlx-qwen36.sh
      - name: Validate Python syntax
        run: python3 -m py_compile scripts/benchmark-frontier.py
