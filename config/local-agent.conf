# Canonical local-agent runtime configuration.
# Every value can be overridden for one invocation with an environment variable.
MODEL_REPO="${MODEL_REPO:-unsloth/Qwen3.6-35B-A3B-UD-MLX-4bit}"
MODEL_ID="${MODEL_ID:-qwen3.6-35b-a3b-ud-mlx-4bit}"
HOST="${HOST:-127.0.0.1}"
PORT="${PORT:-8000}"

# Long-context defaults for repository-scale coding. Increase these only when
# the machine has enough unified memory for the model and KV cache.
CONTEXT="${CONTEXT:-98304}"
MAX_OUTPUT="${MAX_OUTPUT:-24576}"

# Keep one generation stream to avoid starving a large coding session. A small
# admission queue lets health checks or a second client fail cleanly with 503.
MAX_NUM_SEQS="${MAX_NUM_SEQS:-1}"
MAX_CONCURRENT_REQUESTS="${MAX_CONCURRENT_REQUESTS:-2}"
PREFILL_BATCH_SIZE="${PREFILL_BATCH_SIZE:-2}"
COMPLETION_BATCH_SIZE="${COMPLETION_BATCH_SIZE:-1}"
LOG_LEVEL="${LOG_LEVEL:-INFO}"
REQUEST_TIMEOUT="${REQUEST_TIMEOUT:-1800}"
MAX_REQUEST_BYTES="${MAX_REQUEST_BYTES:-33554432}"

TOOL_CALL_PARSER="${TOOL_CALL_PARSER:-qwen3_coder_xml}"
REASONING_PARSER="${REASONING_PARSER:-qwen3}"
PI_PROVIDER="${PI_PROVIDER:-rapid-mlx}"
PI_THINKING_LEVEL="${PI_THINKING_LEVEL:-high}"
